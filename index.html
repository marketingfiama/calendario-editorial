 SF.split('\n').forEach(l=>{const p=l.split('|'),d=+p[0],c=cf(d);mk(d,'fiama','stories','Stories · '+p[1],c,c==='Esquenta Black'?'conversão':'engajamento',p[2])});

function filtered(brandTab){
 const q=S.q.trim().toLowerCase(),f=S.f;
 return S.contents.filter(c=>{
  if(brandTab&&c.brand!==brandTab)return false;
  if(f.brand.length&&!f.brand.includes(c.brand))return false;
  if(f.format.length&&!f.format.includes(c.format))return false;
  if(f.status.length&&!f.status.includes(c.status))return false;
  if(f.objective.length&&!f.objective.includes(c.objective))return false;
  if(q&&![c.title,B[c.brand].n,c.campaign,c.format,c.objective,c.notes,c.product,c.cta].join(' ').toLowerCase().includes(q))return false;
  return true}).sort((a,b)=>a.date.localeCompare(b.date)||a.brand.localeCompare(b.brand))}

 <div><label for="m_cta">CTA</label><input id="m_cta" value="${esc(c.cta)}"></div>
 <div><label for="m_resp">RESPONSÁVEL</label><select id="m_resp">${opt(RESP.map(r=>[r,r]),c.responsible)}</select></div>
 <div class="w"><label for="m_notes">OBSERVAÇÕES</label><textarea id="m_notes" rows="3">${esc(c.notes)}</textarea></div></div>
 ${n?'':`<h3>Checklist de produção</h3><div class="ck">${CK.map(k=>`<label><input type="checkbox" data-ck="${k[0]}" ${c.checklist[k[0]]?'checked':''}> ${k[1]}</label>`).join('')}</div>`}
 <div class="ac"><button class="btn p" data-act="${n?'add':'sv'}" data-id="${c.id||''}">${n?'Adicionar ao calendário':'Salvar alterações'}</button>${n?'':`<button class="btn" data-act="dup" data-id="${c.id}">Duplicar conteúdo</button><button class="btn d" data-act="del" data-id="${c.id}">Excluir</button>`}<button class="btn" data-act="x">Fechar</button></div></div>`}
const val=i=>$('#m_'+i).value;
function readForm(c){Object.assign(c,{brand:val('brand'),date:val('date')||c.date,title:val('title').trim()||'Sem título',format:val('format'),campaign:val('camp'),objective:val('obj'),status:val('status'),product:val('prod'),cta:val('cta'),responsible:val('resp'),notes:val('notes')});return c}
function openContent(id){const c=S.contents.find(x=>x.id==id);if(c)openM(formC(c))}
function newContent(date){openM(formC({brand:'fiama',date:date||ds(inOct?dayOf(today):1),format:'reels',title:'',campaign:'',objective:'conversão',status:'planejado',product:'',cta:'',responsible:'Marketing',notes:'',checklist:emptyCk()}))}
function newIdea(){openM(`<h2>Nova ideia</h2><div class="f"><div class="w"><label for="i_t">TÍTULO</label><input id="i_t"></div><div><label for="i_b">MARCA</label><select id="i_b">${opt(Object.entries(B).map(([k,v])=>[k,v.n]))}</select></div><div><label for="i_th">TEMA</label><input id="i_th"></div><div><label for="i_f">FORMATO</label><select id="i_f">${opt(Object.entries(FM))}</select></div><div><label for="i_o">OBJETIVO</label><select id="i_o">${opt(OB.map(o=>[o,o]))}</select></div><div><label for="i_p">PRIORIDADE</label><select id="i_p">${opt(Object.entries(PRI))}</select></div><div class="w"><label for="i_n">OBSERVAÇÃO</label><textarea id="i_n" rows="2"></textarea></div></div><div class="ac"><button class="btn p" data-act="si">Guardar ideia</button><button class="btn" data-act="x">Fechar</button></div>`)}

/* ============ AÇÕES / EVENTOS ============ */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,.modal');if(!t)return;
 if(t.id==='md'){closeM();return}
 const d=t.dataset;
 if(d.tab){S.tab=d.tab;render()}
 else if(d.view){S.view=d.view;render()}
 else if(d.fk){const a=S.f[d.fk],i=a.indexOf(d.fv);i<0?a.push(d.fv):a.splice(i,1);S.fp=true;render()}
 else if(d.tl){S.tab='cal';S.q='';S.view='semana';S.week=WEEKS.findIndex(w=>+d.tl<=w[1]);render()}
 else if(d.stories){openStories(d.stories)}
 else if(d.id&&!d.act){openContent(d.id)}
 else if(d.ideaDel){S.ideas=S.ideas.filter(i=>i.id!=d.ideaDel);render()}
 else if(d.ideaPlan){const i=S.ideas.find(x=>x.id==d.ideaPlan);newContent();$('#m_title').value=i.title;$('#m_brand').value=i.brand;$('#m_format').value=i.format;$('#m_obj').value=i.obj;$('#m_camp').value=i.theme;$('#m_status').value='ideia'}
 else if(d.act){act(d.act,d.id)}
 else if(t.id==='bf'){S.fp=!S.fp;if(S.tab==='geral'||S.tab==='ideias')S.tab='cal';render()}
 else if(t.id==='bn')newContent();
 else if(t.id==='ex'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='calendario-editorial-outubro-2026.json';a.click();toast('Dados exportados')}
 else if(t.id==='im')$('#fi').click();
 else if(t.id==='rs'){if(confirm('Apagar todas as alterações e voltar ao planejamento original do PDF?')){S=fresh();render();toast('Calendário resetado')}}
});
function act(a,id){
 const c=S.contents.find(x=>x.id==id);
 if(a==='x')closeM();
 else if(a==='clr'){S.f={brand:[],format:[],status:[],objective:[]};S.q='';$('#q').value='';render()}
 else if(a==='wp'){S.week=Math.max(0,S.week-1);render()}
 else if(a==='wn'){S.week=Math.min(4,S.week+1);render()}
 else if(a==='wc'){S.week=inOct?WEEKS.findIndex(w=>dayOf(today)<=w[1]):0;render()}
 else if(a==='ni')newIdea();
 else if(a==='si'){S.ideas.push({id:Date.now(),title:$('#i_t').value||'Ideia sem título',brand:$('#i_b').value,theme:$('#i_th').value,format:$('#i_f').value,obj:$('#i_o').value,pri:$('#i_p').value,note:$('#i_n').value});closeM();render();toast('Ideia guardada')}
 else if(a==='add'){const n=readForm({id:nextId(),checklist:emptyCk()});S.contents.push(n);closeM();render();toast('Conteúdo criado')}
 else if(a==='sv'){readForm(c);closeM();render();toast('Conteúdo salvo')}
 else if(a==='dup'){S.contents.push({...JSON.parse(JSON.stringify(readForm(c))),id:nextId(),title:c.title+' (cópia)'});closeM();render();toast('Conteúdo duplicado')}
 else if(a==='del'){if(confirm('Excluir este conteúdo?')){S.contents=S.contents.filter(x=>x!==c);closeM();render();toast('Conteúdo excluído')}}}
document.addEventListener('change',e=>{
 const k=e.target.dataset.ck;if(k){const id=document.querySelector('[data-act=sv]')?.dataset.id,c=S.contents.find(x=>x.id==id);c.checklist[k]=e.target.checked;save();toast(e.target.checked?'✔ Etapa concluída':'Etapa reaberta')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#q').addEventListener('input',e=>{S.q=e.target.value;if(S.tab==='geral'||S.tab==='ideias')S.tab='cal';render()});
$('#fi').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.contents))throw 0;S=Object.assign(fresh(),j);render();toast('Dados importados')}catch(x){alert('Arquivo inválido. Use um JSON exportado por este calendário.')}};r.readAsText(f);e.target.value=''});
/* drag and drop (Kanban) */
let dragId=null;
document.addEventListener('dragstart',e=>{const i=e.target.closest('.it');if(i)dragId=i.dataset.id});
document.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest?.('.col')?.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest('.col');if(!c||!dragId)return;e.preventDefault();const x=S.contents.find(v=>v.id==dragId);if(x&&x.status!==c.dataset.drop){x.status=c.dataset.drop;render();toast('Status atualizado: '+ST[x.status][0])}dragId=null});
if(inOct)S.week=WEEKS.findIndex(w=>dayOf(today)<=w[1]);
render();
</script></body></html>
